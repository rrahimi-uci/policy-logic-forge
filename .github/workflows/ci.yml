name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Validate NeurIPS execution plan
        run: python scripts/validate_neurips_plan.py --check
      - name: Validate pipeline configuration
        run: python scripts/validate_config.py
      - name: Validate retained research artifacts
        run: python scripts/validate_research_artifacts.py
      - name: Validate NeurIPS paper source contract
        run: python paper/scripts/validate_paper.py --source paper/main.tex --check-source
      - name: Run tests with compiler coverage gate
        run: |
          python -m coverage erase
          python -m coverage run -m pytest -q
          python -m coverage report
