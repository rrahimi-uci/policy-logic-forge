<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Capabilities around the evidence spine</title>
  <desc id="desc">Eight necessary capabilities surround a central bidirectional evidence spine linking source passages to operational artifacts.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#0c1d33"/></linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#31d6c6"/><stop offset=".5" stop-color="#54b8ff"/><stop offset="1" stop-color="#9b8cff"/></linearGradient>
    <filter id="s3" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020914" flood-opacity=".4"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg3)"/>
  <text x="82" y="92" fill="#31d6c6" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">WHAT IS NEEDED</text>
  <text x="82" y="156" fill="#f7fbff" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="750">Reliability requires a system of capabilities.</text>
  <text x="82" y="201" fill="#b4c4d9" font-family="Inter,Arial,sans-serif" font-size="24">The model is one component. Evidence is the shared contract.</text>

  <g stroke="#39546f" stroke-width="2" stroke-dasharray="7 7">
    <path d="M290 380L610 463"/><path d="M290 545L610 489"/><path d="M550 290L690 432"/><path d="M550 690L690 521"/>
    <path d="M1310 380L990 463"/><path d="M1310 545L990 489"/><path d="M1050 290L910 432"/><path d="M1050 690L910 521"/>
  </g>

  <g filter="url(#s3)" font-family="Inter,Arial,sans-serif">
    <g transform="translate(82 322)"><rect width="360" height="112" rx="18" fill="#10233d" stroke="#2c4563"/><circle cx="43" cy="40" r="19" fill="#31d6c6" opacity=".18" stroke="#31d6c6"/><text x="43" y="47" text-anchor="middle" fill="#31d6c6" font-size="21" font-weight="700">1</text><text x="78" y="43" fill="#f7fbff" font-size="23" font-weight="700">Source integrity</text><text x="24" y="82" fill="#b4c4d9" font-size="18">Preserve document and chunk identity</text></g>
    <g transform="translate(82 486)"><rect width="360" height="112" rx="18" fill="#10233d" stroke="#2c4563"/><circle cx="43" cy="40" r="19" fill="#54b8ff" opacity=".18" stroke="#54b8ff"/><text x="43" y="47" text-anchor="middle" fill="#54b8ff" font-size="21" font-weight="700">2</text><text x="78" y="43" fill="#f7fbff" font-size="23" font-weight="700">Business vocabulary</text><text x="24" y="82" fill="#b4c4d9" font-size="18">Govern definitions and relations</text></g>
    <g transform="translate(372 235)"><rect width="360" height="112" rx="18" fill="#10233d" stroke="#2c4563"/><circle cx="43" cy="40" r="19" fill="#ffbd66" opacity=".18" stroke="#ffbd66"/><text x="43" y="47" text-anchor="middle" fill="#ffbd66" font-size="21" font-weight="700">3</text><text x="78" y="43" fill="#f7fbff" font-size="23" font-weight="700">Rule contracts</text><text x="24" y="82" fill="#b4c4d9" font-size="18">Make conditions and exceptions clear</text></g>
    <g transform="translate(372 653)"><rect width="360" height="112" rx="18" fill="#10233d" stroke="#2c4563"/><circle cx="43" cy="40" r="19" fill="#9b8cff" opacity=".18" stroke="#9b8cff"/><text x="43" y="47" text-anchor="middle" fill="#9b8cff" font-size="21" font-weight="700">4</text><text x="78" y="43" fill="#f7fbff" font-size="23" font-weight="700">Dependency semantics</text><text x="24" y="82" fill="#b4c4d9" font-size="18">Separate relation from sequence</text></g>

    <g transform="translate(1158 322)"><rect width="360" height="112" rx="18" fill="#10233d" stroke="#2c4563"/><circle cx="43" cy="40" r="19" fill="#31d6c6" opacity=".18" stroke="#31d6c6"/><text x="43" y="47" text-anchor="middle" fill="#31d6c6" font-size="21" font-weight="700">5</text><text x="78" y="43" fill="#f7fbff" font-size="23" font-weight="700">Independent verification</text><text x="24" y="82" fill="#b4c4d9" font-size="18">Re-check claims against the source</text></g>
    <g transform="translate(1158 486)"><rect width="360" height="112" rx="18" fill="#10233d" stroke="#2c4563"/><circle cx="43" cy="40" r="19" fill="#54b8ff" opacity=".18" stroke="#54b8ff"/><text x="43" y="47" text-anchor="middle" fill="#54b8ff" font-size="21" font-weight="700">6</text><text x="78" y="43" fill="#f7fbff" font-size="23" font-weight="700">Selective models</text><text x="24" y="82" fill="#b4c4d9" font-size="18">Generate only what the source shows</text></g>
    <g transform="translate(868 235)"><rect width="360" height="112" rx="18" fill="#10233d" stroke="#2c4563"/><circle cx="43" cy="40" r="19" fill="#ffbd66" opacity=".18" stroke="#ffbd66"/><text x="43" y="47" text-anchor="middle" fill="#ffbd66" font-size="21" font-weight="700">7</text><text x="78" y="43" fill="#f7fbff" font-size="23" font-weight="700">Human explainability</text><text x="24" y="82" fill="#b4c4d9" font-size="18">Show what is uncertain, and why</text></g>
    <g transform="translate(868 653)"><rect width="360" height="112" rx="18" fill="#10233d" stroke="#2c4563"/><circle cx="43" cy="40" r="19" fill="#9b8cff" opacity=".18" stroke="#9b8cff"/><text x="43" y="47" text-anchor="middle" fill="#9b8cff" font-size="21" font-weight="700">8</text><text x="78" y="43" fill="#f7fbff" font-size="23" font-weight="700">Change awareness</text><text x="24" y="82" fill="#b4c4d9" font-size="18">Trace revisions into impacted work</text></g>

    <rect x="594" y="394" width="412" height="160" rx="80" fill="#0e2b43" stroke="url(#spine)" stroke-width="3"/>
    <text x="800" y="449" text-anchor="middle" fill="#31d6c6" font-size="19" font-weight="700" letter-spacing="3">THE EVIDENCE SPINE</text>
    <text x="800" y="490" text-anchor="middle" fill="#f7fbff" font-size="24" font-weight="700">Source ⇄ claim ⇄ rule ⇄ artifact</text>
    <text x="800" y="526" text-anchor="middle" fill="#b4c4d9" font-size="18">Trace forward. Explain backward.</text>
  </g>

  <text x="800" y="830" text-anchor="middle" fill="#f7fbff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="650">A pipeline is trustworthy only when evidence survives every stage boundary.</text>
  <text x="82" y="869" fill="#7186a1" font-family="Inter,Arial,sans-serif" font-size="17">Policy Logic Forge · capability model</text>
</svg>
