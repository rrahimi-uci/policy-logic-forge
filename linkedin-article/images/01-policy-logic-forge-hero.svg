<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Policy Logic Forge: from policy to code-ready artifacts</title>
  <desc id="desc">Four phases show policy documents transformed into structured knowledge, reasoning and verification, and code-ready artifacts, joined by a bidirectional evidence trace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#0d2037"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#31d6c6"/><stop offset="1" stop-color="#54b8ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020914" flood-opacity=".45"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54b8ff"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1410" cy="110" r="280" fill="#31d6c6" opacity=".045"/><circle cx="160" cy="840" r="330" fill="#9b8cff" opacity=".055"/>
  <text x="88" y="98" fill="#31d6c6" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="4">POLICY LOGIC FORGE</text>
  <text x="88" y="177" fill="#f7fbff" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="760">A policy is not an algorithm.</text>
  <text x="88" y="229" fill="#b4c4d9" font-family="Inter,Arial,sans-serif" font-size="28">Preserve meaning and evidence across every transformation.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="330" width="315" height="280" rx="24" fill="#10233d" stroke="#2c4563"/>
    <rect x="80" y="330" width="315" height="8" rx="4" fill="#ffbd66"/>
    <text x="112" y="391" fill="#ffbd66" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">01 · POLICY</text>
    <text x="112" y="437" fill="#f7fbff" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700">Source corpus</text>
    <path d="M120 474h58l18 18v76h-76z" fill="none" stroke="#ffbd66" stroke-width="3"/><path d="M178 474v20h18" fill="none" stroke="#ffbd66" stroke-width="3"/><path d="M137 514h42M137 535h42" stroke="#b4c4d9" stroke-width="3"/>
    <text x="220" y="494" fill="#b4c4d9" font-family="Inter,Arial,sans-serif" font-size="20">clauses · tables</text>
    <text x="220" y="527" fill="#b4c4d9" font-family="Inter,Arial,sans-serif" font-size="20">scope · exceptions</text>
    <text x="220" y="560" fill="#b4c4d9" font-family="Inter,Arial,sans-serif" font-size="20">source identity</text>

    <rect x="455" y="330" width="315" height="280" rx="24" fill="#10233d" stroke="#2c4563"/>
    <rect x="455" y="330" width="315" height="8" rx="4" fill="#31d6c6"/>
    <text x="487" y="391" fill="#31d6c6" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">02 · KNOWLEDGE</text>
    <text x="487" y="437" fill="#f7fbff" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700">Structured meaning</text>
    <circle cx="532" cy="516" r="27" fill="#31d6c6" opacity=".2" stroke="#31d6c6" stroke-width="3"/><circle cx="648" cy="488" r="22" fill="#31d6c6" opacity=".2" stroke="#31d6c6" stroke-width="3"/><circle cx="663" cy="555" r="25" fill="#31d6c6" opacity=".2" stroke="#31d6c6" stroke-width="3"/><path d="M558 509l68-17M557 527l82 23" stroke="#31d6c6" stroke-width="3"/>
    <text x="487" y="591" fill="#b4c4d9" font-family="Inter,Arial,sans-serif" font-size="20">concepts · rules · relations</text>

    <rect x="830" y="330" width="315" height="280" rx="24" fill="#10233d" stroke="#2c4563"/>
    <rect x="830" y="330" width="315" height="8" rx="4" fill="#54b8ff"/>
    <text x="862" y="391" fill="#54b8ff" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">03 · REASONING</text>
    <text x="862" y="437" fill="#f7fbff" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700">Verify before export</text>
    <path d="M935 476l54 18v46c0 39-25 60-54 73-29-13-54-34-54-73v-46z" fill="#54b8ff" opacity=".16" stroke="#54b8ff" stroke-width="3"/><path d="M910 540l18 18 35-41" fill="none" stroke="#54b8ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1008" y="506" fill="#b4c4d9" font-family="Inter,Arial,sans-serif" font-size="20">readiness</text><text x="1008" y="539" fill="#b4c4d9" font-family="Inter,Arial,sans-serif" font-size="20">grounding</text><text x="1008" y="572" fill="#b4c4d9" font-family="Inter,Arial,sans-serif" font-size="20">dependencies</text>

    <rect x="1205" y="330" width="315" height="280" rx="24" fill="#10233d" stroke="#2c4563"/>
    <rect x="1205" y="330" width="315" height="8" rx="4" fill="#9b8cff"/>
    <text x="1237" y="391" fill="#9b8cff" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">04 · ARTIFACTS</text>
    <text x="1237" y="437" fill="#f7fbff" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700">Selective outputs</text>
    <g font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700"><rect x="1237" y="476" width="83" height="42" rx="10" fill="#9b8cff" opacity=".2" stroke="#9b8cff"/><text x="1255" y="504" fill="#d9d3ff">DMN</text><rect x="1332" y="476" width="83" height="42" rx="10" fill="#9b8cff" opacity=".2" stroke="#9b8cff"/><text x="1346" y="504" fill="#d9d3ff">BPMN</text><rect x="1427" y="476" width="61" height="42" rx="10" fill="#9b8cff" opacity=".2" stroke="#9b8cff"/><text x="1435" y="504" fill="#d9d3ff">CMMN</text><rect x="1237" y="532" width="83" height="42" rx="10" fill="#9b8cff" opacity=".2" stroke="#9b8cff"/><text x="1251" y="560" fill="#d9d3ff">SBVR</text><rect x="1332" y="532" width="83" height="42" rx="10" fill="#9b8cff" opacity=".2" stroke="#9b8cff"/><text x="1344" y="560" fill="#d9d3ff">LinkML</text><rect x="1427" y="532" width="61" height="42" rx="10" fill="#9b8cff" opacity=".2" stroke="#9b8cff"/><text x="1435" y="560" fill="#d9d3ff">HTML</text></g>
  </g>

  <g stroke="#54b8ff" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M400 470h45"/><path d="M775 470h45"/><path d="M1150 470h45"/></g>
  <path d="M250 686h1100" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="800" y="736" fill="#f7fbff" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">BIDIRECTIONAL EVIDENCE TRACE</text>
  <text x="800" y="777" fill="#b4c4d9" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21">Every artifact can point back to the rule, claim, document, and source chunk that produced it.</text>
  <text x="88" y="850" fill="#7186a1" font-family="Inter,Arial,sans-serif" font-size="17">Repository-backed architecture · September 2026</text>
</svg>
